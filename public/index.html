<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Builder</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="card">
      <h1>GitHub Repository Builder</h1>
      <p>Paste a GitHub repository URL, then add any environment variables you want before building. Include a PORT variable if your app should run on a specific port.</p>
      <form id="build-form">
        <input id="repo-url" type="text" placeholder="https://github.com/owner/repo" required />
        <div id="env-fields" class="env-fields"></div>
        <button type="button" id="add-env-field">+ Add Variable</button>
        <button type="submit">Build</button>
      </form>
      <button id="clear-workspaces" type="button">Clear Workspaces</button>
      <p id="status">Status: waiting</p>
      <div class="panel-grid">
        <div class="panel">
          <h3>Build Logs</h3>
          <pre id="log">Logs will appear here...</pre>
        </div>
        <div class="panel">
          <h3>Docker Commands</h3>
          <ul id="docker-command-list" class="docker-command-list"></ul>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
