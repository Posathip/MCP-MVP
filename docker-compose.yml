services:
  mvp-mcp-deployer:
    build:
      context: .
      args:
        PORT: ${PORT}
    container_name: mvp-mcp-deployer
    restart: unless-stopped
    ports:
      - "${PORT}:${PORT}"
    environment:
      - PORT=${PORT}
    working_dir: ${PWD}
    command: ["sh", "-c", "npm install --omit=dev && node server.js"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}:${PWD}
